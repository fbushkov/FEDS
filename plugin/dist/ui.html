<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<style>/* FEDS UI — Figma UI3: цвета из темы Figma (themeColors: true), светлая и тёмная тема без отдельной вёрстки. */
:root {
  --bg: var(--figma-color-bg, #fff);
  --bg2: var(--figma-color-bg-secondary, #f5f5f5);
  --bg3: var(--figma-color-bg-tertiary, #e6e6e6);
  --hover: var(--figma-color-bg-hover, #f0f0f0);
  --text: var(--figma-color-text, #1e1e1e);
  --text2: var(--figma-color-text-secondary, #757575);
  --text3: var(--figma-color-text-tertiary, #b3b3b3);
  --border: var(--figma-color-border, #e6e6e6);
  --brand: var(--figma-color-bg-brand, #0d99ff);
  --on-brand: var(--figma-color-text-onbrand, #fff);
  --brand-text: var(--figma-color-text-brand, #007be5);
  --danger: var(--figma-color-text-danger, #dc3412);
  --danger-bg: var(--figma-color-bg-danger-tertiary, #fff1ee);
  --warn: var(--figma-color-text-warning, #b86200);
  --warn-bg: var(--figma-color-bg-warning-tertiary, #fff7e6);
  --ok: var(--figma-color-text-success, #14ae5c);
  --ok-bg: var(--figma-color-bg-success-tertiary, #ebfff2);
  --mono: 'Roboto Mono', 'SF Mono', Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 11px/16px Inter, 'Segoe UI', system-ui, sans-serif; }
#app { display: flex; flex-direction: column; height: 100vh; }

header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
header .title { font-weight: 600; font-size: 13px; }
header .file { color: var(--text2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

nav { display: flex; gap: 2px; padding: 4px 8px; border-bottom: 1px solid var(--border); overflow-x: auto; }
nav button { border: 0; background: none; color: var(--text2); padding: 6px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; font: inherit; }
nav button:hover { background: var(--hover); color: var(--text); }
nav button.active { background: var(--bg3); color: var(--text); font-weight: 600; }
nav button:disabled { color: var(--text3); cursor: default; background: none; }
nav .soon { font-size: 9px; margin-left: 4px; color: var(--text3); }

main { flex: 1; overflow: auto; padding: 12px; }
footer { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); }
footer .spacer { flex: 1; }

h2 { font-size: 13px; line-height: 20px; margin: 0 0 8px; font-weight: 600; }
h3 { font-size: 11px; margin: 16px 0 6px; font-weight: 600; }
p { margin: 0 0 8px; color: var(--text2); }

.btn { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 5px; padding: 0 10px; height: 24px; font: inherit; cursor: pointer; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: transparent; font-weight: 500; }
.btn.primary:disabled { opacity: .4; cursor: default; }
.btn.danger { color: var(--danger); }
.icon-btn { border: 0; background: none; color: var(--text2); width: 24px; height: 24px; border-radius: 5px; cursor: pointer; font-size: 14px; }
.icon-btn:hover { background: var(--hover); color: var(--text); }

.cards { display: grid; gap: 6px; }
.card { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
.card:hover { background: var(--hover); }
.card.sel { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
.card .name { font-weight: 600; }
.card .meta { color: var(--text2); grid-column: 1 / -1; }

.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.chip { border: 1px solid var(--border); border-radius: 12px; padding: 1px 8px; background: var(--bg); cursor: pointer; font: inherit; color: var(--text); }
.chip.on { background: var(--bg3); font-weight: 600; }

.box { border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
.box.err { background: var(--danger-bg); color: var(--danger); }
.box.warn { background: var(--warn-bg); color: var(--warn); }
.box.ok { background: var(--ok-bg); color: var(--ok); }
.box ul { margin: 4px 0 0; padding-left: 16px; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text2); font-weight: 500; position: sticky; top: -12px; background: var(--bg); }
td.mono, .mono { font-family: var(--mono); font-size: 10px; word-break: break-all; }
.st { border-radius: 4px; padding: 0 5px; white-space: nowrap; font-size: 10px; }
.st.add { background: var(--ok-bg); color: var(--ok); }
.st.same { background: var(--bg2); color: var(--text2); }
.st.changed { background: var(--warn-bg); color: var(--warn); }
.st.extra { background: var(--bg3); color: var(--text); }
.st.blocked { background: var(--danger-bg); color: var(--danger); }

details { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; }
summary { padding: 6px 10px; cursor: pointer; }
details > div { padding: 0 10px 8px; max-height: 240px; overflow: auto; }

.progress { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; flex: 1; }
.progress > i { display: block; height: 100%; background: var(--brand); transition: width .15s; }

.empty { color: var(--text2); text-align: center; padding: 48px 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; margin-bottom: 12px; }
.stat { background: var(--bg2); border-radius: 6px; padding: 8px; }
.stat b { display: block; font-size: 16px; line-height: 20px; }

.modal-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--bg); border-radius: 8px; padding: 16px; max-width: 420px; width: 100%; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
label.field { display: grid; gap: 2px; margin-bottom: 8px; color: var(--text2); }
input[type=text] { height: 28px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text); padding: 0 8px; font: inherit; }

.muted { color: var(--text2); }
.group { margin-bottom: 12px; }
.group-head { display: flex; align-items: baseline; gap: 8px; }
.group-head h3 { margin-right: auto; }
.link { border: 0; background: none; color: var(--brand-text); cursor: pointer; font: inherit; padding: 0; }
.link:hover { text-decoration: underline; }
.row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.row:hover { background: var(--hover); }
.row.on { background: var(--bg2); }
.row input { margin-top: 2px; }
.row .grow { flex: 1; min-width: 0; }
</style>
</head>
