<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEroom: изменения токенов</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e2e5ea; --text: #1b1e23; --muted: #5d6572;
  --accent: #2374db; --accent-soft: #e6f0fc; --add: #1f7a3d; --add-soft: #e5f4ea; --chg: #9a5b00; --chg-soft: #fdf1dc;
  --del: #b42318; --del-soft: #fde8e6; --check-a: #d7dbe1; --check-b: #ffffff; --shadow: 0 1px 2px rgba(16,24,40,.06);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --surface: #1d2025; --surface-2: #24282e; --border: #33383f; --text: #e8eaed; --muted: #9aa3ae;
    --accent: #6ea8f5; --accent-soft: #1d2d44; --add: #6fcf8f; --add-soft: #173322; --chg: #f0b35a; --chg-soft: #3a2a12;
    --del: #f28b82; --del-soft: #3d1b18; --check-a: #3a3f46; --check-b: #2a2e34; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --surface: #1d2025; --surface-2: #24282e; --border: #33383f; --text: #e8eaed; --muted: #9aa3ae;
  --accent: #6ea8f5; --accent-soft: #1d2d44; --add: #6fcf8f; --add-soft: #173322; --chg: #f0b35a; --chg-soft: #3a2a12;
  --del: #f28b82; --del-soft: #3d1b18; --check-a: #3a3f46; --check-b: #2a2e34; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 32px 16px 80px; }
header h1 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; }
header p { margin: 0; color: var(--muted); max-width: 820px; }
.theme { float: right; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 24px 0 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 2px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.card .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .big small { font-size: 15px; color: var(--muted); font-weight: 500; }
.card .sub { color: var(--muted); font-size: 13px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pill { border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.add { background: var(--add-soft); color: var(--add); }
.pill.chg { background: var(--chg-soft); color: var(--chg); }
.pill.del { background: var(--del-soft); color: var(--del); }
.pill.neu { background: var(--surface-2); color: var(--muted); }
.notes { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin: 12px 0 24px; }
.notes ul { margin: 0; padding-left: 18px; }
.notes li { margin: 3px 0; }
h2 { font-size: 19px; margin: 32px 0 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border); margin: 8px 0 14px; }
.tab { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 9px 12px; border-bottom: 2px solid transparent; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .n { font-weight: 500; opacity: .8; margin-left: 4px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.tools input, .tools select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.tools input { flex: 1 1 260px; }
.count { color: var(--muted); font-size: 13px; }
details.group { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
details.group > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; list-style: none; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
details.group[open] > summary::before { transform: rotate(90deg); }
summary .desc { color: var(--muted); font-weight: 400; font-size: 13px; }
.tbl { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 12px; border-top: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--surface-2); white-space: nowrap; }
td.name, .mono { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.val { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; }
.val + .val { margin-left: 4px; }
.sw { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border); flex: none; position: relative; overflow: hidden;
  background: conic-gradient(var(--check-a) 25%, var(--check-b) 0 50%, var(--check-a) 0 75%, var(--check-b) 0) 0 0 / 8px 8px; }
.sw i { position: absolute; inset: 0; }
.arrow { color: var(--muted); margin: 0 6px; }
.old { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--del) 60%, transparent); }
.why { color: var(--muted); font-size: 12px; max-width: 320px; }
.mode { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; margin-right: 4px; }
.cell-mode { display: block; margin: 2px 0; white-space: nowrap; }
.tree { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 10px; }
.tree .card { padding: 12px 14px; }
.tree .card h4 { margin: 0 0 6px; font-size: 14px; }
.tree ul { margin: 0; padding: 0; list-style: none; }
.tree li { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 12px; padding: 2px 0; border-top: 1px dashed var(--border); }
.tree li:first-child { border-top: 0; }
.tag-new { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; color: var(--add); }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.legend { color: var(--muted); font-size: 13px; margin: -4px 0 12px; }
@media (max-width: 720px) {
  header h1 { font-size: 22px; }
  .theme { float: none; margin-bottom: 12px; }
  th, td { padding: 6px 8px; }
  .why { max-width: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="theme" id="theme" type="button" aria-label="Переключить тему">Тема</button>
    <h1>FEroom: изменения токенов</h1>
    <p id="lead"></p>
  </header>

  <section class="cards" id="cards" aria-label="Сводка по уровням"></section>
  <div class="notes" id="notes"></div>

  <h2>Структура: новые группы</h2>
  <p class="legend">Где появились новые токены. <span class="tag-new">новое</span> — такой группы в исходной библиотеке не было.</p>
  <div class="tree" id="tree"></div>

  <h2>Все изменения</h2>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Поиск по имени токена, алиасу или причине" aria-label="Поиск">
    <select id="owner" aria-label="Компонент"></select>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
</div>

<script>
const D = /*DATA*/null;

// тема: переключатель поверх системной
const root = document.documentElement;
try { const t = localStorage.getItem('feroom-diff-theme'); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('feroom-diff-theme', root.dataset.theme); } catch (e) {}
};

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => n.toLocaleString('ru-RU');
const title = (c) => (c === 'system' ? 'Система (общий L2)' : (D.titles[c] || c));

function val(x, label) {
  if (!x) return '<span class="val old">—</span>';
  const ref = x.ref ?? x.l1;
  const sw = x.c ? `<span class="sw"><i style="background:${x.c}"></i></span>` : '';
  const raw = x.v !== null && x.v !== undefined && !x.c ? ` <span class="old" style="text-decoration:none">(${esc(x.v)})</span>` : '';
  return `<span class="val">${sw}${esc(ref ?? '—')}${raw}</span>`;
}
function modes(before, after) {
  return ['light', 'dark'].map((m) => {
    const b = before ? before[m] : null, a = after[m];
    const same = before && b && a && (b.ref ?? b.l1) === (a.ref ?? a.l1);
    return `<span class="cell-mode"><span class="mode">${m === 'light' ? 'светлая' : 'тёмная'}</span>` +
      (before ? (same ? val(a) : `<span class="old">${val(b)}</span><span class="arrow">→</span>${val(a)}`) : val(a)) + '</span>';
  }).join('');
}

// ---------- сводка
const S = D.summary;
document.getElementById('lead').textContent =
  `Сравнение исходной библиотеки «F · DS · Элементы · Основа стилей» (снимок analysis/token-index.json) с актуальными пресетами плагина FEDS (presets/*.tokens.json) на ${D.generated}. ` +
  'Порядок ссылок сохранён: L3 → L2 → L1.';
const card = (lvl, name, s, extra = '') => `<div class="card"><h3>${lvl} · ${name}</h3>
  <div class="big">${fmt(s.after)} <small>было ${fmt(s.before)}</small></div>
  <div class="pills">
    <span class="pill add">+${fmt(s.added)} новых</span>
    <span class="pill chg">~${fmt(s.changed)} изменено</span>
    <span class="pill ${D.removed[lvl.slice(1)].length ? 'del' : 'neu'}">−${D.removed[lvl.slice(1)].length} удалено</span>
    ${extra}
  </div></div>`;
document.getElementById('cards').innerHTML =
  card('L1', 'Primitives', S.l1) +
  card('L2', 'General', S.l2) +
  card('L3', 'Components', S.l3, `<span class="pill neu" title="Алиас не менялся, но изменилось значение L2, на который он ссылается">${fmt(S.l3.indirect)} косвенно</span>`);

const newComps = [...new Set(D.added_l3.map((r) => r.name.split('/')[0]))].filter((n) => !D.orig_ns3.includes(n));
document.getElementById('notes').innerHTML = `<ul>
  <li><b>L1 не менялся</b>: все ${fmt(S.l1.before)} примитивов совпадают по значению.</li>
  <li><b>Ничего не удалено и не переименовано</b>: каждый исходный токен есть в актуальной версии.</li>
  <li><b>Изменено ${fmt(S.l2.changed)} значений L2</b>: исправления контраста WCAG AA в светлой и тёмной теме. Меняется только то, на какую ступень L1 ссылается токен, имена и структура прежние.</li>
  <li><b>Изменено ${fmt(S.l3.changed)} алиасов L3</b> у существующих компонентов (${[...new Set(D.changed_l3.map((r) => title(r.owner)))].join(', ')}): контраст и тип Inverse у Button. Каждое изменение одобрено и помечено в пресете.</li>
  <li><b>Добавлено ${fmt(S.l2.added)} L2 и ${fmt(S.l3.added)} L3</b> для новых компонентов${newComps.length ? `: ${newComps.join(', ')}` : ''}. Новые L2 появились там, где существующих не хватало.</li>
</ul>`;

// ---------- структура: где появились новые токены
(function tree() {
  const g3 = {};
  for (const r of D.added_l3) { const ns = r.name.split('/')[0]; (g3[ns] ||= { n: 0, owner: r.owner }).n++; }
  const g2 = {};
  for (const r of D.added_l2) { const k = r.name.split('/').slice(0, 3).join('/'); (g2[k] ||= 0); g2[k]++; }
  const li = (k, n, isNew) => `<li><span>${esc(k)}${isNew ? ' <span class="tag-new">новое</span>' : ''}</span><span>${n}</span></li>`;
  const top2 = Object.entries(g2).sort((a, b) => b[1] - a[1]);
  const byRoot = {};
  for (const [k, n] of top2) (byRoot[k.split('/')[0]] ||= []).push([k, n]);
  document.getElementById('tree').innerHTML =
    `<div class="card"><h4>L3 · 3. Components — пространства имён</h4><ul>${Object.entries(g3).sort((a, b) => b[1].n - a[1].n)
      .map(([k, v]) => li(k + '/…', v.n, !D.orig_ns3.includes(k))).join('')}</ul></div>` +
    Object.entries(byRoot).sort((a, b) => b[1].reduce((s, x) => s + x[1], 0) - a[1].reduce((s, x) => s + x[1], 0)).map(([rt, items]) =>
      `<div class="card"><h4>L2 · 2. General — ${esc(rt)}/…</h4><ul>${items.map(([k, n]) => li(k + '/…', n, !D.orig_g2.includes(k))).join('')}</ul></div>`).join('');
})();

// ---------- вкладки и списки
const TABS = [
  { id: 'cl2', label: 'Изменённые L2', rows: D.changed_l2, group: (r) => r.name.split('/').slice(0, 3).join('/') },
  { id: 'cl3', label: 'Изменённые L3', rows: D.changed_l3, group: (r) => title(r.owner) },
  { id: 'al2', label: 'Новые L2', rows: D.added_l2, group: (r) => title(r.owner) },
  { id: 'al3', label: 'Новые L3', rows: D.added_l3, group: (r) => title(r.owner) },
  { id: 'ind', label: 'L3, изменённые косвенно', rows: D.indirect.map((n) => ({ name: n, owner: n.split('/')[0] })), group: (r) => r.name.split('/')[0] },
];
let cur = TABS[0];
const tabsEl = document.getElementById('tabs');
tabsEl.innerHTML = TABS.map((t, i) => `<button class="tab" role="tab" id="t-${t.id}" aria-selected="${i === 0}">${t.label}<span class="n">${fmt(t.rows.length)}</span></button>`).join('');
tabsEl.onclick = (e) => { const b = e.target.closest('.tab'); if (!b) return; cur = TABS.find((t) => 't-' + t.id === b.id); for (const x of tabsEl.children) x.setAttribute('aria-selected', x === b); fillOwners(); render(); };

const ownerEl = document.getElementById('owner');
function fillOwners() {
  const gs = [...new Set(cur.rows.map(cur.group))].sort((a, b) => a.localeCompare(b, 'ru'));
  ownerEl.innerHTML = `<option value="">Все группы (${gs.length})</option>` + gs.map((g) => `<option>${esc(g)}</option>`).join('');
}
function rowHtml(r) {
  if (cur.id === 'cl2' || cur.id === 'al2') {
    return `<tr><td class="name">${esc(r.name)}</td><td>${modes(cur.id === 'cl2' ? r.before : null, r.after)}</td><td class="why">${esc(r.reason)}</td></tr>`;
  }
  if (cur.id === 'cl3' || cur.id === 'al3') {
    const alias = r.before.alias
      ? `<span class="val old">${esc(r.before.alias)}</span><span class="arrow">→</span><span class="val">${esc(r.after.alias)}</span>`
      : `<span class="val">${esc(r.after.alias)}</span>`;
    return `<tr><td class="name">${esc(r.name)}</td><td class="mono">${alias}</td><td>${modes(r.before.res, r.after.res)}</td><td class="why">${esc(r.reason)}</td></tr>`;
  }
  return `<tr><td class="name">${esc(r.name)}</td></tr>`;
}
function head() {
  if (cur.id === 'cl2') return '<tr><th>Токен L2</th><th>Значение: было → стало</th><th>Причина</th></tr>';
  if (cur.id === 'al2') return '<tr><th>Токен L2</th><th>Значение (L1)</th><th>Описание</th></tr>';
  if (cur.id === 'cl3') return '<tr><th>Токен L3</th><th>Алиас L2: было → стало</th><th>Итоговый цвет</th><th>Причина</th></tr>';
  if (cur.id === 'al3') return '<tr><th>Токен L3</th><th>Алиас L2</th><th>Итоговое значение</th><th>Описание</th></tr>';
  return '<tr><th>Токен L3: алиас прежний, значение L2 под ним изменено</th></tr>';
}
const qEl = document.getElementById('q');
function render() {
  const q = qEl.value.trim().toLowerCase(), own = ownerEl.value;
  const rows = cur.rows.filter((r) => (!own || cur.group(r) === own) &&
    (!q || [r.name, r.reason, r.after?.alias, r.before?.alias, JSON.stringify(r.after || '')].join(' ').toLowerCase().includes(q)));
  const groups = new Map();
  for (const r of rows) { const g = cur.group(r); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(r); }
  document.getElementById('count').textContent = `Показано ${fmt(rows.length)} из ${fmt(cur.rows.length)}`;
  const open = groups.size <= 3 || !!q || !!own;
  document.getElementById('list').innerHTML = rows.length ? [...groups].sort((a, b) => a[0].localeCompare(b[0], 'ru')).map(([g, rs]) =>
    `<details class="group"${open ? ' open' : ''}><summary>${esc(g)} <span class="desc">${fmt(rs.length)}</span></summary>
     <div class="tbl"><table><thead>${head()}</thead><tbody>${rs.map(rowHtml).join('')}</tbody></table></div></details>`).join('')
    : '<div class="empty">Ничего не найдено</div>';
}
qEl.oninput = render; ownerEl.onchange = render;
fillOwners(); render();
</script>
</body>
</html>
